function quote(s, b) {
  const L = s.levels[b.level];
  const base = L + Math.max(0, b.beds - 1) * s.perBed + Math.max(0, b.baths - 1) * s.perBath + (SQ_ADD[b.sqft] || 0);
  const add = (b.addons || []).reduce((t, id) => t + (ADDONS.find(a => a.id === id) || { price: 0 }).price, 0);
  const disc = Math.round((base + add) * (s.discounts[b.freq] || 0) / 100);
  const service = base + add - disc;
  const fee = Math.round(service * s.feePct / 100);
  const credit = Math.min(b.credit || 0, service + fee);
  const promo = Math.min(b.promoOff || 0, service + fee - credit);
  const total = service + fee - credit - promo;
  const payout = Math.round(service * (100 - s.commissionPct) / 100);
  const h = LEVEL_META[b.level].hours + (b.beds - 3) * 0.5 + (b.baths - 2) * 0.5 + (b.addons || []).length * 0.3;
  const hours = Math.max(1.5, Math.round(h * 2) / 2);
  return { base, add, disc, service, fee, credit, promo, total, payout, platform: service + fee - payout, hours };
}

/* ============ automation engine ============ */
function runAutomations(db, only) {
  const logs = [];
  const on = (id) => (!only || only.includes(id)) && db.automations.find(a => a.id === id).on;
  const bump = (id) => { db.automations.find(a => a.id === id).runs++; };
  const say = (rule, text) => { logs.push({ rule, text }); bump(rule); };
  const cl = (id) => db.cleaners.find(c => c.id === id);
  const cu = (id) => db.customers.find(c => c.id === id);
  const busy = (cid, b) => db.bookings.some(x => x.cleaner === cid && x.date === b.date && x.time === b.time && x.id !== b.id && x.status !== 'cancelled');
  const load = (cid, date) => db.bookings.filter(x => x.cleaner === cid && x.date === date && x.status !== 'cancelled').length;

  if (on('dispatch') || on('escalate')) {
    db.bookings.filter(b => b.status === 'unassigned' && daysFrom(TODAY, b.date) >= 0).forEach(b => {
      const pool = db.cleaners.filter(c => c.status === 'active' && c.available && c.towns.includes(b.town) && !(db.declined[c.id] || []).includes(b.id) && !busy(c.id, b));
      if (on('dispatch') && pool.length) {
        const best = pool.map(c => ({ c, score: c.rating * 20 - load(c.id, b.date) * 6 })).sort((x, y) => y.score - x.score)[0].c;
        b.cleaner = best.id; b.status = 'assigned';
        say('dispatch', `${b.id} in ${b.hood} assigned to ${best.name} (rating ${best.rating}, ${load(best.id, b.date) - 1} other jobs that day).`);
      } else if (on('escalate') && !b.flags.escalated) {
        b.flags.escalated = true; b.bonus = db.settings.escalationBonus; b.price.payout += b.bonus;
        say('escalate', `No available cleaner covers ${b.town} for ${b.id}. Added a $${b.bonus} bonus, re-broadcast the job and alerted ops.`);
      }
    });
  }
  if (on('reminders')) db.bookings.filter(b => b.status === 'assigned' && daysFrom(TODAY, b.date) === 1 && !b.flags.reminded).forEach(b => {
    b.flags.reminded = true; say('reminders', `Reminder sent to ${cu(b.cust).name} and ${cl(b.cleaner).name} for ${b.id} tomorrow at ${b.time}.`);
  });
  if (on('reviews')) db.bookings.filter(b => b.status === 'completed' && b.rating == null && !b.flags.reviewRequested).forEach(b => {
    b.flags.reviewRequested = true; say('reviews', `Asked ${cu(b.cust).name} to rate and tip ${b.id}; asked ${cl(b.cleaner).name} to rate the booking.`);
  });
  if (on('lowrating')) db.bookings.filter(b => b.status === 'completed' && b.rating != null && b.rating <= 3 && !b.flags.ticket).forEach(b => {
    b.flags.ticket = true;
    const id = 'T-' + (302 + db.tickets.length);
    db.tickets.unshift({ id, type: 'Re-clean', booking: b.id, cust: b.cust, cleaner: b.cleaner, subject: `${b.rating}-star rating: “${b.review || 'No comment'}”`, status: 'open', created: TODAY });
    say('lowrating', `${b.rating}-star rating on ${b.id}. Opened ${id}, offered ${cu(b.cust).name} a free re-clean and flagged ${cl(b.cleaner).name}’s profile for review.`);
  });
  if (on('recurring')) db.bookings.filter(b => b.freq !== 'once' && ['assigned', 'completed'].includes(b.status) && !b.flags.nextCreated).forEach(b => {
    b.flags.nextCreated = true;
    const nb = { ...JSON.parse(JSON.stringify(b)), id: 'B-' + (++db.seq), date: addDays(b.date, FREQ_DAYS[b.freq]), status: b.cleaner ? 'assigned' : 'unassigned', rating: null, review: '', paidOut: false, flags: {}, bonus: 0, credit: 0, promoOff: 0 };
    nb.price = quote(db.settings, nb);
    db.bookings.push(nb);
    say('recurring', `Created ${nb.id} for ${cu(b.cust).name} on ${fmtDay(nb.date)}${b.cleaner ? ` with ${cl(b.cleaner).name}` : ''} (${FREQ[b.freq].toLowerCase()}).`);
  });
  if (on('payouts')) {
    const due = db.bookings.filter(b => b.status === 'completed' && !b.paidOut && b.cleaner);
    const by = {};
    due.forEach(b => { (by[b.cleaner] = by[b.cleaner] || []).push(b); b.paidOut = 'scheduled'; });
    Object.entries(by).forEach(([cid, list]) => {
      const amount = list.reduce((t, b) => t + b.price.payout + (b.tip || 0), 0);
      db.payouts.unshift({ id: 'P-' + (78 + db.payouts.length), cleaner: cid, amount, jobs: list.length, date: '2026-11-06', status: 'scheduled' });
      say('payouts', `Scheduled ${money(amount)} to ${cl(cid).name} for ${list.length} completed ${list.length === 1 ? 'job' : 'jobs'} (Friday, Nov 6).`);
    });
  }
  if (on('nudge')) db.applicants.filter(a => a.stage !== 'ready' && daysFrom(a.updated, TODAY) >= 3 && !a.nudged).forEach(a => {
    a.nudged = true; say('nudge', `${a.name} has been on “${STAGES.find(s => s.id === a.stage).name}” for ${daysFrom(a.updated, TODAY)} days. Reminder sent in ${a.lang}.`);
  });
  if (on('docs')) db.cleaners.filter(c => daysFrom(TODAY, c.insuranceExp) <= 30 && !c.docReminded).forEach(c => {
    c.docReminded = true; say('docs', `${c.name}’s insurance certificate expires ${fmtShort(c.insuranceExp)}. Upload request sent.`);
  });
  if (on('abandoned')) db.drafts.filter(d => !d.followed).forEach(d => {
    d.followed = true; say('abandoned', `Emailed the saved ${LEVEL_META[d.level].name} quote (${money(d.total)}) to ${d.email}.`);
  });
  if (on('referral')) db.customers.filter(c => c.referredBy && !c.referralPaid && db.bookings.some(b => b.cust === c.id && b.status === 'completed')).forEach(c => {
    c.referralPaid = true; c.credits += db.settings.referralCredit; const r = cu(c.referredBy); r.credits += db.settings.referralCredit;
    say('referral', `${c.name} finished a first clean. Added $${db.settings.referralCredit} credit to ${c.name} and to ${r.name}, who referred them.`);
  });
  if (on('waitlist')) db.waitlist.filter(w => !w.notified && db.settings.zips.includes(w.zip)).forEach(w => {
    w.notified = true; say('waitlist', `${ZIPS[w.zip]} (${w.zip}) is now open. Told ${w.email} they can book.`);
  });
  const stamp = new Date(2026, 10, 3, 13, 45 + db.tick++).toLocaleTimeString('en-US', { hour: 'numeric', minute: '2-digit' });
  logs.forEach(l => db.log.unshift({ ...l, t: stamp, id: Math.random().toString(36).slice(2) }));
  return logs;
}

const LS = {

function addAccount(d, acc) {
  const town = ZIPS[acc.zip] || 'West Hartford';
  const ex = d.customers.find(c => c.id === 'cu-me');
  if (ex) Object.assign(ex, { name: acc.name, email: acc.email, zip: acc.zip, town, hood: (HOODS[town] || ['—'])[0], provider: acc.provider });
  else {
    const first = acc.name.split(' ')[0] || 'NEW';
    d.customers.push({ id: 'cu-me', name: acc.name, email: acc.email, phone: acc.phone || '', town, hood: (HOODS[town] || ['—'])[0], zip: acc.zip, ref: first.toUpperCase().replace(/[^A-Z]/g, '').slice(0, 8) + '25', referredBy: null, credits: 0, joined: TODAY, provider: acc.provider });
    if (!d.settings.zips.includes(acc.zip) && !d.waitlist.some(w => w.email === acc.email)) d.waitlist.push({ email: acc.email, zip: acc.zip, notified: false });
  }
  d.me = 'cu-me';
}

const TOUR = [

  { id: 'nav', title: 'Everything else lives here', text: 'Track your bookings, message your cleaner and manage your account.' },

function Tour({ onDone }) {
  const [i, setI] = useState(0);
  const [rect, setRect] = useState(null);
  useEffect(() => {
    const find = () => {
      const el = [...document.querySelectorAll(`[data-tour="${TOUR[i].id}"]`)].find(e => e.offsetParent !== null);
      if (!el) { setRect(null); return; }
      const r = el.getBoundingClientRect();
      if (r.top < 70 || r.bottom > window.innerHeight - 20) { el.scrollIntoView({ block: 'center' }); }
      const r2 = el.getBoundingClientRect();
      setRect({ top: r2.top - 6, left: r2.left - 6, width: r2.width + 12, height: r2.height + 12 });
    };
    find(); const t = setTimeout(find, 120);
    window.addEventListener('resize', find); window.addEventListener('scroll', find, true);
    return () => { clearTimeout(t); window.removeEventListener('resize', find); window.removeEventListener('scroll', find, true); };
  }, [i]);
  const s = TOUR[i];
  const below = rect && rect.top + rect.height + 210 < window.innerHeight;
  const cardStyle = rect ? (below ? { top: rect.top + rect.height + 12 } : { top: Math.max(12, rect.top - 200) }) : { top: '40%' };
  return (
    <div className="fixed inset-0 z-[75]" role="dialog" aria-label="Quick tour">
      {rect ? <div className="absolute rounded-2xl pointer-events-none transition-all duration-300" style={{ ...rect, boxShadow: '0 0 0 9999px rgba(23,43,58,.55)', border: '2px solid #A8D8F0' }} /> : <div className="absolute inset-0 bg-ink/55" />}
      <div className="absolute left-1/2 -translate-x-1/2 w-[min(360px,calc(100vw-32px))] card lift p-5 fade" key={i} style={cardStyle}>

        <div className="flex justify-between items-center mt-4">

        </div>
      </div>
    </div>
  );
}

function CBookings({ me, onBook }) {
  const { db, act } = useStore();
  const mine = db.bookings.filter(b => b.cust === me.id);
  const upcoming = mine.filter(b => !['completed', 'cancelled'].includes(b.status)).sort((a, b) => a.date.localeCompare(b.date));
  const past = mine.filter(b => ['completed', 'cancelled'].includes(b.status)).sort((a, b) => b.date.localeCompare(a.date));
  const [tab, setTab] = useState('upcoming');
  const [rate, setRate] = useState({});
  const [msg, setMsg] = useState('');
  const msgs = db.messages.filter(m => m.cust === me.id);
  const cancel = (id) => act(d => { const x = d.bookings.find(b => b.id === id); x.status = 'cancelled'; x.flags.nextCreated = true; });
  const submitRating = (id) => { const r = rate[id]; if (!r?.stars) return; act(d => { const x = d.bookings.find(b => b.id === id); x.rating = r.stars; x.review = r.text || ''; x.tip = r.tip || 0; }, ['lowrating', 'referral']); };
  return (
    <div className="py-6">
      <h1 className="text-[26px] font-semibold">Bookings</h1>
      <div className="flex p-1 rounded-xl bg-white border border-line w-max mt-4">{[['upcoming', `Upcoming (${upcoming.length})`], ['past', `Past (${past.length})`]].map(([k, l]) => <button key={k} onClick={() => setTab(k)} className={'h-9 px-4 rounded-lg text-[13.5px] font-semibold ' + (tab === k ? 'bg-ink text-white' : 'text-mute')}>{l}</button>)}</div>
      <div className="grid gap-4 mt-5">
        {tab === 'upcoming' && upcoming.length === 0 && <div className="card p-8 text-center"><span className="w-12 h-12 rounded-2xl bg-soft text-deep grid place-items-center mx-auto"><Ic n="CalendarDays" s={22} /></span><div className="font-semibold mt-3">No upcoming cleanings</div><div className="text-[14px] text-mute mt-1">Book one and follow it live right here.</div><button onClick={() => onBook()} className="btn btn-p mt-4">Book a cleaning</button></div>}
        {tab === 'upcoming' && upcoming.map(b => (
          <div key={b.id} className="grid gap-2">
            <Tracker b={b} />
            <div className="flex flex-wrap gap-2"><button className="btn btn-g btn-s"><Ic n="CalendarClock" s={15} />Reschedule</button><button className="btn btn-g btn-s" onClick={() => cancel(b.id)}>{b.freq !== 'once' ? 'Skip this visit' : 'Cancel'} {daysFrom(TODAY, b.date) * 24 > db.settings.cancelHours ? '(free)' : `($${db.settings.lateCancelFee} fee)`}</button></div>
          </div>
        ))}
        {tab === 'upcoming' && upcoming.some(b => b.cleaner) && <div className="card p-5">
          <div className="font-semibold">Messages</div>
          <div className="mt-3 grid gap-2 max-h-[240px] overflow-y-auto">
            {msgs.length === 0 && <div className="text-[13.5px] text-mute">Say hi or share anything your cleaner should know.</div>}
            {msgs.map((m, k) => <div key={k} className={'rounded-2xl px-3.5 py-2.5 text-[13.5px] max-w-[85%] ' + (m.from === me.id ? 'bg-soft justify-self-end' : 'bg-mist')}><div>{m.text}</div><div className="text-[11px] text-mute mt-1">{m.from === me.id ? 'You' : 'Your cleaner'} · {m.t}</div></div>)}
          </div>
          <form className="flex gap-2 mt-3" onSubmit={(e) => { e.preventDefault(); if (!msg.trim()) return; act(d => { d.messages.push({ cust: d.me, from: d.me, text: msg.trim(), t: 'Just now' }); }); setMsg(''); }}>
            <label htmlFor="c-msg" className="sr-only">Message your cleaner</label>
            <input id="c-msg" className="field" placeholder="Message your cleaner" value={msg} onChange={e => setMsg(e.target.value)} /><button className="btn btn-p" aria-label="Send"><Ic n="Send" s={16} /></button>
          </form>
          <div className="text-[11.5px] text-mute mt-2">Phone numbers stay private on both sides.</div>
        </div>}
        {tab === 'past' && past.length === 0 && <div className="card p-6 text-[14px] text-mute">Your finished cleanings and receipts will show up here.</div>}
        {tab === 'past' && past.map(b => {
          const c = db.cleaners.find(x => x.id === b.cleaner); const r = rate[b.id] || {};
          return (
            <div key={b.id} className="card p-5">
              <div className="flex flex-wrap justify-between gap-2"><div><div className="font-semibold">{LEVEL_META[b.level].name}{c ? ` with ${c.name}` : ''}</div><div className="text-[13px] text-mute">{fmtDay(b.date)} · {b.id}</div></div><div className="text-right"><div className="font-semibold tnum">{b.status === 'cancelled' ? 'Cancelled' : money(b.price.total)}</div>{b.status !== 'cancelled' && <div className="text-[12px] text-mute">Receipt emailed</div>}</div></div>
              {b.status === 'completed' && (b.rating != null ? <div className="mt-3 flex items-center gap-3 text-[13px] text-mute"><Stars value={b.rating} size={17} />{b.review && <span>“{b.review}”</span>}</div> : (
                <div className="mt-4 rounded-xl bg-mist p-4 grid gap-3">
                  <div className="text-[14px] font-semibold">How was your clean?</div>
                  <Stars value={r.stars || 0} onChange={(v) => setRate({ ...rate, [b.id]: { ...r, stars: v } })} size={30} />
                  <input id={'rv-' + b.id} className="field" placeholder="What went well? (optional)" value={r.text || ''} onChange={e => setRate({ ...rate, [b.id]: { ...r, text: e.target.value } })} />
                  <div className="flex flex-wrap items-center gap-2"><span className="text-[13px] text-mute">Tip:</span>{[0, 10, 15, 20].map(t => <Chip key={t} on={(r.tip || 0) === t} onClick={() => setRate({ ...rate, [b.id]: { ...r, tip: t } })}>{t ? '$' + t : 'No tip'}</Chip>)}</div>
                  <button disabled={!r.stars} onClick={() => submitRating(b.id)} className="btn btn-p justify-self-start">Submit</button>
                </div>
              ))}
              {b.status === 'completed' && <button onClick={() => onBook({ level: b.level, beds: b.beds, baths: b.baths, addons: b.addons })} className="mt-3 text-[13.5px] font-semibold text-deep">Book this again</button>}
            </div>
          );
        })}
      </div>
    </div>
  );
}

          <div className="flex justify-between text-[12px] text-mute mt-1.5"><span>Cleaner {Math.round(ex.payout / ex.total * 100)}%</span><span>Neatly {Math.round(ex.platform / ex.total * 100)}%</span></div>

      </div>
    </div>
  );
}

function App() {

  const dbRef = useRef(db); dbRef.current = db;
  const [toasts, setToasts] = useState([]);
  const toast = (logs) => logs.forEach((l, k) => { const id = Math.random().toString(36).slice(2); setTimeout(() => { setToasts(t => [...t.slice(-3), { id, ...l }]); setTimeout(() => setToasts(t => t.filter(x => x.id !== id)), 5200); }, k * 350); });
  const act = (fn, autos) => {
    const d = structuredClone(dbRef.current);
    fn(d);
    let logs = [];
    if (autos !== undefined) logs = runAutomations(d, autos);
    dbRef.current = d; setDb(d);
    if (logs.length) toast(logs);
    else if (autos === null) toast([{ rule: 'manual', text: 'Automations ran. Nothing new to process right now.' }]);
  };
  const later = (fn, ms) => setTimeout(fn, ms);
  const signIn = (acc) => { LS.set('neatly.account', acc); LS.set('neatly.saved', acc); act(d => addAccount(d, acc)); setAccount(acc); window.scrollTo(0, 0); };
  const signOut = () => { LS.del('neatly.account'); setAccount(null); act(d => { d.me = 'cu1'; }); window.scrollTo(0, 0); };
  useEffect(() => { const on = () => setView(read()); window.addEventListener('hashchange', on); return () => window.removeEventListener('hashchange', on); }, []);
  const go = (v) => { setView(v); try { history.replaceState(null, '', '#' + v); } catch (e) { } window.scrollTo(0, 0); };
  return (
    <Store.Provider value={{ db, act, later }}>
      <div className="sticky z-50 bg-white/95 backdrop-blur border-b border-line gutter" style={{ top: 'env(safe-area-inset-top, 0px)' }}>
        <div className="wrapw h-[60px] flex items-center gap-3">
          <div className="flex items-center gap-2 shrink-0"><Logo size={28} /><span className="font-semibold tracking-tight hidden sm:inline">Neatly</span><span className="pill bg-mist border border-line text-mute hidden md:inline-flex">Working prototype</span></div>
          <div className="hscroll flex-1 min-w-0"><div className="flex gap-1 w-max ml-auto p-1 rounded-xl bg-mist border border-line">
            {VIEWS.map(([k, l, i]) => <button key={k} onClick={() => go(k)} aria-current={view === k ? 'page' : undefined} className={'h-9 px-3 rounded-lg text-[13px] font-semibold flex items-center gap-1.5 whitespace-nowrap ' + (view === k ? 'bg-white shadow-sm text-ink' : 'text-mute hover:text-ink')}><Ic n={i} s={15} />{l}</button>)}
          </div></div>
        </div>
      </div>
      {view === 'customer' && <CustomerApp goPortal={() => go('cleaner')} account={account} signIn={signIn} signOut={signOut} />}
      {view === 'cleaner' && <CleanerPortal />}
      {view === 'admin' && <Admin />}
      {view === 'blueprint' && <Blueprint />}
      <div className={'gutter border-t border-line bg-white ' + (view === 'customer' && account ? 'pb-20 lg:pb-0' : '')}><div className="wrapw py-4 text-[12px] text-mute">Prototype with sample people and prices. All three portals share one live data set: a booking made on the customer website appears in the admin console and on Maria’s job board. Your sign-in is simulated and saved only in this browser. Reloading the page resets everything.</div></div>
      <div className="toastbox" aria-live="polite">
        {toasts.map(t => <div key={t.id} className="fade card lift p-3.5 flex gap-3 bg-white"><span className="w-8 h-8 rounded-lg bg-ink text-sky grid place-items-center shrink-0"><Ic n="Zap" s={15} /></span><div className="min-w-0"><div className="text-[11.5px] font-semibold text-deep">{(db.automations.find(a => a.id === t.rule) || { name: 'Automation' }).name}</div><div className="text-[13px] leading-snug">{t.text}</div></div></div>)}
      </div>
    </Store.Provider>
  );
}
